specVersion: '2.4'
metadata:
  name: zilo-models
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - "/test/**"
  customTasks:
  - name: ui5-task-zipper
    afterTask: generateCachebusterInfo
    configuration:
      archiveName: zilo-models
      additionalFiles:
      - xs-app.json
